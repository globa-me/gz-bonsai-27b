[package]
name = "bonsai-desktop"
version = "0.6.2"
description = "A simple local home for Bonsai models"
authors = ["Bonsai Desktop contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "bonsai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
keyring = "4.2.0"
pdf-extract = "0.12.1"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["fs", "process", "sync", "time", "io-util", "macros"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
